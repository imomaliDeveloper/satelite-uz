<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Topics - SATELITE.UZ Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar-nav"></aside>

    <main class="admin-main">
      <div class="admin-top-bar">
        <div style="display: flex; align-items: center; gap: 14px;">
          <button id="sidebar-toggle-btn" class="btn btn-icon btn-secondary mobile-sidebar-toggle">☰</button>
          <div>
            <h1 class="admin-page-title">Topic Taxonomy</h1>
            <p class="text-secondary" style="font-size: 0.95rem;">Manage competencies, skill domains, and sub-topics.</p>
          </div>
        </div>

        <button class="btn btn-primary btn-sm" onclick="openTopicModal()">➕ Add Topic</button>
      </div>

      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Topic Name</th>
              <th>Parent Subject</th>
              <th>Slug</th>
              <th>Description</th>
              <th>Questions</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="topics-tbody">
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px;">
                Loading topics...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Topic Modal -->
  <div class="modal-backdrop" id="topic-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="topic-modal-title">Add Topic</h3>
        <button onclick="closeTopicModal()" style="font-size: 1.5rem; color: var(--text-muted);">×</button>
      </div>
      <form id="topic-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="topic-subject-select">Parent Subject *</label>
            <select id="topic-subject-select" class="form-select" required>
              <option value="">Select Parent Subject</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="topic-name">Topic Name *</label>
            <input type="text" id="topic-name" class="form-input" placeholder="e.g. Linear Equations in 1 Variable" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="topic-slug">URL Slug *</label>
            <input type="text" id="topic-slug" class="form-input" placeholder="e.g. linear-equations" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="topic-desc">Description</label>
            <textarea id="topic-desc" class="form-textarea" rows="2" placeholder="Topic details..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeTopicModal()">Cancel</button>
          <button type="submit" id="topic-submit-btn" class="btn btn-primary">Save Topic</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin/admin.js"></script>
  <script src="/js/admin/topics.js"></script>
</body>
</html>
