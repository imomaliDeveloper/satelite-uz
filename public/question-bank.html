<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Bank - SATELITE.UZ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/sat-math-tools.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <style>
    .qb-page {
      padding-top: 104px;
      padding-bottom: 80px;
    }

    .qb-filter-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .qb-search-input {
      flex: 1.5;
      min-width: 260px;
      position: relative;
    }

    .questions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
      margin-bottom: 36px;
    }

    .q-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .q-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .q-text-preview {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.55;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text-primary);
    }

    .q-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .bookmark-btn {
      font-size: 1.25rem;
      color: var(--text-muted);
      transition: color var(--transition-fast), transform var(--transition-fast);
    }

    .bookmark-btn:hover {
      transform: scale(1.15);
      color: #f59e0b;
    }

    .bookmark-btn.active {
      color: #f59e0b;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
            <circle cx="12" cy="12" r="3"></circle>
            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"></ellipse>
          </svg>
        </div>
        <span>SATELITE<span class="text-cyan">.UZ</span></span>
      </a>

      <nav>
        <ul class="nav-links" id="navbar-links">
          <li><a href="/practice.html" class="nav-link">Practice</a></li>
          <li><a href="/question-bank.html" class="nav-link active">Question Bank</a></li>
          <li><a href="/exam.html" class="nav-link">Exams</a></li>
          <li><a href="/dashboard.html" class="nav-link">My Progress</a></li>
        </ul>
      </nav>

      <div class="nav-actions" id="navbar-actions"></div>
    </div>
  </header>

  <main class="qb-page">
    <div class="container">
      <div style="margin-bottom: 28px;">
        <h1 style="font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px;">
          Question Bank Repository
        </h1>
        <p class="text-secondary" style="font-size: 1.05rem;">
          Explore and filter high-yield examination questions across all tested subjects and competencies.
        </p>
      </div>

      <!-- Filters & Search Bar -->
      <div class="qb-filter-bar">
        <div class="filter-row">
          <div class="qb-search-input">
            <input type="text" id="search-input" class="form-input" placeholder="🔍 Search questions by keyword or topic...">
          </div>

          <div style="min-width: 180px;">
            <select id="subject-filter" class="form-select">
              <option value="">All Subjects</option>
            </select>
          </div>

          <div style="min-width: 180px;">
            <select id="topic-filter" class="form-select">
              <option value="">All Topics</option>
            </select>
          </div>
        </div>

        <div class="filter-row" style="justify-content: space-between;">
          <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <select id="difficulty-filter" class="form-select" style="width: auto;">
              <option value="">All Difficulties</option>
              <option value="EASY">Easy</option>
              <option value="MEDIUM">Medium</option>
              <option value="HARD">Hard</option>
            </select>

            <select id="type-filter" class="form-select" style="width: auto;">
              <option value="">All Question Types</option>
              <option value="MULTIPLE_CHOICE">Multiple Choice</option>
              <option value="MULTI_SELECT">Multi-Select</option>
              <option value="TRUE_FALSE">True / False</option>
            </select>
          </div>

          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="text-muted" style="font-size: 0.88rem;">Sort By:</span>
            <select id="sort-filter" class="form-select" style="width: auto;">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="difficulty">Difficulty</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Questions List Grid -->
      <div id="questions-container" class="questions-grid">
        <div class="skeleton" style="height: 220px;"></div>
        <div class="skeleton" style="height: 220px;"></div>
        <div class="skeleton" style="height: 220px;"></div>
      </div>

      <!-- Pagination Toolbar -->
      <div class="pagination card" id="pagination-bar" style="display: none; padding: 16px 24px;">
        <div class="text-secondary" style="font-size: 0.9rem;" id="pagination-info">
          Showing 1 to 20
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="prev-page-btn" class="btn btn-sm btn-outline">Previous</button>
          <button id="next-page-btn" class="btn btn-sm btn-outline">Next</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Question Detail Preview Modal -->
  <div class="modal-backdrop" id="detail-modal">
    <div class="modal-dialog" style="max-width: 680px;">
      <div class="modal-header">
        <div style="display: flex; gap: 10px; align-items: center;" id="modal-badges"></div>
        <button onclick="closeDetailModal()" style="font-size: 1.5rem; color: var(--text-muted);">×</button>
      </div>
      <div class="modal-body" id="modal-body" style="color: var(--text-primary);">
        <!-- Injected dynamically -->
      </div>
      <div class="modal-footer" style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-sm btn-outline" onclick="if(window.SatMathTools) SatMathTools.openCalculator()" title="Open Desmos Calculator">
            🧮 Calculator
          </button>
          <button class="btn btn-sm btn-outline" onclick="if(window.SatMathTools) SatMathTools.openReferenceSheet()" title="Open SAT Reference Sheet">
            📐 Reference
          </button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" onclick="closeDetailModal()">Close</button>
          <a href="#" id="modal-practice-btn" class="btn btn-primary">Practice This Question</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sat-math-tools.js"></script>
  <script src="/js/question-bank.js"></script>
</body>
</html>
