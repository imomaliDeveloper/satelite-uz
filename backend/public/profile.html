<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile & History - SATELITE.UZ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <style>
    .tab-nav {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 28px;
    }

    .tab-btn {
      padding: 12px 20px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
            <circle cx="12" cy="12" r="3"></circle>
            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"></ellipse>
          </svg>
        </div>
        <span>SATELITE<span class="text-cyan">.UZ</span></span>
      </a>

      <nav>
        <ul class="nav-links" id="navbar-links">
          <li><a href="/practice.html" class="nav-link">Practice</a></li>
          <li><a href="/question-bank.html" class="nav-link">Question Bank</a></li>
          <li><a href="/exam.html" class="nav-link">Exams</a></li>
          <li><a href="/dashboard.html" class="nav-link">My Progress</a></li>
        </ul>
      </nav>

      <div class="nav-actions" id="navbar-actions"></div>
    </div>
  </header>

  <main class="dashboard-page">
    <div class="container">
      
      <!-- Profile Header Card -->
      <div class="card" style="padding: 36px; margin-bottom: 36px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 24px;">
        <div style="display: flex; align-items: center; gap: 20px;">
          <div style="width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-cyan) 100%); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #ffffff; font-weight: 800;" id="profile-avatar">
            A
          </div>
          <div>
            <h1 style="font-size: 1.85rem; font-weight: 800; margin-bottom: 4px;" id="profile-name">Student Name</h1>
            <p class="text-secondary" style="font-size: 0.95rem;" id="profile-email">student@gmail.com</p>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
              <span class="badge badge-subject" id="profile-role">STUDENT</span>
              <span class="badge badge-easy">ACTIVE</span>
            </div>
          </div>
        </div>

        <button type="button" class="btn btn-outline logout-btn" data-action="logout" onclick="Auth.logout()">Log Out</button>
      </div>

      <!-- Navigation Tabs -->
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="bookmarks-tab">Saved Bookmarks (<span id="bookmark-count-badge">0</span>)</button>
        <button class="tab-btn" data-tab="history-tab">Assessment History</button>
        <button class="tab-btn" data-tab="security-tab">Security & Password</button>
      </div>

      <!-- Tab 1: Bookmarks -->
      <div id="bookmarks-tab" class="tab-pane active">
        <div class="kpi-grid" id="bookmarks-list" style="grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));">
          <div class="skeleton" style="height: 200px;"></div>
        </div>
      </div>

      <!-- Tab 2: Assessment History -->
      <div id="history-tab" class="tab-pane">
        <div class="card" style="padding: 24px;">
          <table class="results-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Assessment Title</th>
                <th>Score</th>
                <th>Accuracy</th>
                <th>Duration</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="history-table-body">
              <tr>
                <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">
                  Loading assessment history...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab 3: Security & Password -->
      <div id="security-tab" class="tab-pane">
        <div class="card" style="max-width: 520px; padding: 32px;">
          <h3 style="font-size: 1.3rem; margin-bottom: 18px;">Update Password</h3>
          <form id="change-password-form">
            <div class="form-group">
              <label class="form-label" for="current-pwd">Current Password</label>
              <input type="password" id="current-pwd" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="new-pwd">New Password (Min. 8 characters)</label>
              <input type="password" id="new-pwd" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="confirm-pwd">Confirm New Password</label>
              <input type="password" id="confirm-pwd" class="form-input" required>
            </div>
            <button type="submit" id="pwd-submit-btn" class="btn btn-primary" style="width: 100%;">
              Update Password
            </button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
