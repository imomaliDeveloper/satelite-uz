<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Review - SATELITE.UZ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/practice.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <style>
    .review-filter-pills {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .review-q-card {
      margin-bottom: 28px;
      padding: 32px;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
    }

    .review-choice-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface-elevated);
    }

    .review-choice-item.correct-choice {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .review-choice-item.user-wrong-choice {
      border-color: var(--danger);
      background: var(--danger-bg);
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
            <circle cx="12" cy="12" r="3"></circle>
            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"></ellipse>
          </svg>
        </div>
        <span>SATELITE<span class="text-cyan">.UZ</span></span>
      </a>

      <nav>
        <ul class="nav-links" id="navbar-links">
          <li><a href="/practice.html" class="nav-link">Practice</a></li>
          <li><a href="/question-bank.html" class="nav-link">Question Bank</a></li>
          <li><a href="/exam.html" class="nav-link">Exams</a></li>
          <li><a href="/dashboard.html" class="nav-link">My Progress</a></li>
        </ul>
      </nav>

      <div class="nav-actions" id="navbar-actions"></div>
    </div>
  </header>

  <main class="dashboard-page">
    <div class="container" style="max-width: 900px;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 6px;">Answer Review & Explanations</h1>
          <p class="text-secondary" id="review-subtitle">Examine your choices and understand key explanations.</p>
        </div>

        <a href="/dashboard.html" class="btn btn-outline">Back to Dashboard</a>
      </div>

      <!-- Filter Pills -->
      <div class="review-filter-pills">
        <button class="btn btn-sm btn-primary review-filter-btn" data-filter="ALL">All Questions</button>
        <button class="btn btn-sm btn-secondary review-filter-btn" data-filter="INCORRECT">Incorrect Only</button>
        <button class="btn btn-sm btn-secondary review-filter-btn" data-filter="CORRECT">Correct Only</button>
        <button class="btn btn-sm btn-secondary review-filter-btn" data-filter="SKIPPED">Skipped Only</button>
      </div>

      <!-- Question List Container -->
      <div id="review-list-container">
        <div class="skeleton" style="height: 300px; margin-bottom: 24px;"></div>
        <div class="skeleton" style="height: 300px;"></div>
      </div>

    </div>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/review.js"></script>
</body>
</html>
