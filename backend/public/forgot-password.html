<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SATELITE.UZ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-visual-side">
      <div id="auth-canvas-container"></div>
      <div class="auth-visual-header">
        <a href="/" class="brand-logo">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
              <circle cx="12" cy="12" r="3"></circle>
              <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"></ellipse>
            </svg>
          </div>
          <span>SATELITE<span class="text-cyan">.UZ</span></span>
        </a>
      </div>
      <div class="auth-visual-footer">
        <blockquote class="auth-quote">"Security and privacy are central to learning with confidence."</blockquote>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-card">
        <div class="auth-header">
          <h2 class="auth-title">Password Recovery</h2>
          <p class="auth-subtitle">Enter your registered email address and we'll help you regain access.</p>
        </div>

        <form id="recover-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="student@gmail.com" required>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem;">
            Send Recovery Instructions
          </button>
        </form>

        <div class="auth-footer-links">
          Remembered your password? <a href="/login.html">Back to Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/hero-3d.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.SateliteScene) {
        new SateliteScene('auth-canvas-container', { isCompact: true });
      }

      const form = document.getElementById('recover-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        Toast.success('Password recovery email dispatched (simulated). Please check your inbox.');
      });
    });
  </script>
</body>
</html>
