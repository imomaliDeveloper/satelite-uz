<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Mode - SATELITE.UZ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/practice.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
            <circle cx="12" cy="12" r="3"></circle>
            <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"></ellipse>
          </svg>
        </div>
        <span>SATELITE<span class="text-cyan">.UZ</span></span>
      </a>

      <nav>
        <ul class="nav-links" id="navbar-links">
          <li><a href="/practice.html" class="nav-link active">Practice</a></li>
          <li><a href="/question-bank.html" class="nav-link">Question Bank</a></li>
          <li><a href="/exam.html" class="nav-link">Exams</a></li>
          <li><a href="/dashboard.html" class="nav-link">My Progress</a></li>
        </ul>
      </nav>

      <div class="nav-actions" id="navbar-actions"></div>
    </div>
  </header>

  <main class="practice-page">
    <div class="container practice-container">
      
      <!-- Loading Skeleton -->
      <div id="practice-loading">
        <div class="skeleton" style="height: 36px; width: 40%; margin-bottom: 24px;"></div>
        <div class="card" style="padding: 36px;">
          <div class="skeleton" style="height: 80px; margin-bottom: 24px;"></div>
          <div class="skeleton" style="height: 48px; margin-bottom: 12px;"></div>
          <div class="skeleton" style="height: 48px; margin-bottom: 12px;"></div>
          <div class="skeleton" style="height: 48px; margin-bottom: 12px;"></div>
          <div class="skeleton" style="height: 48px;"></div>
        </div>
      </div>

      <!-- Practice Main Card -->
      <div id="practice-workspace" style="display: none;">
        <!-- Meta Bar -->
        <div class="practice-meta-bar">
          <div class="practice-badges">
            <span class="question-counter" id="q-counter">Question 1 / 10</span>
            <span class="badge badge-subject" id="q-subject">Math</span>
            <span class="badge badge-topic" id="q-topic">Algebra</span>
            <span class="badge badge-medium" id="q-difficulty">MEDIUM</span>
          </div>

          <button id="q-bookmark-btn" class="btn btn-sm btn-outline" style="gap: 6px;">
            <span id="bookmark-icon">☆</span>
            <span>Bookmark</span>
          </button>
        </div>

        <!-- Question Body Card -->
        <div class="card practice-card">
          <div class="question-content" id="q-text">
            Loading question...
          </div>

          <div class="question-image-wrap" id="q-image-wrap" style="display: none;">
            <img id="q-image" src="" alt="Question diagram">
          </div>

          <!-- Options Grid -->
          <div class="options-grid" id="options-container">
            <!-- Dynamically populated choices -->
          </div>

          <!-- Explanation Container (Appears post-submission) -->
          <div id="explanation-container" style="display: none;">
            <!-- Dynamically inserted explanation card -->
          </div>
        </div>

        <!-- Practice Actions Footer -->
        <div class="practice-footer-bar">
          <button id="prev-btn" class="btn btn-secondary" disabled>← Previous</button>

          <div style="display: flex; gap: 12px;">
            <button id="skip-btn" class="btn btn-outline">Skip</button>
            <button id="submit-answer-btn" class="btn btn-primary" disabled>Submit Answer</button>
            <button id="next-btn" class="btn btn-primary" style="display: none;">Continue →</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/practice.js"></script>
</body>
</html>
