<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - SATELITE.UZ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary);">

  <div style="position: absolute; top: 24px; right: 24px;">
    <button class="btn btn-ghost btn-icon theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">🌙</button>
  </div>

  <div class="card card-glass" style="max-width: 440px; width: 100%; margin: 20px; padding: 40px; border-color: rgba(99,102,241,0.3); box-shadow: var(--shadow-glow);">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
          <circle cx="12" cy="12" r="3"></circle>
          <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"></ellipse>
        </svg>
      </div>
      <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 6px;">Admin Authentication</h2>
      <p class="text-secondary" style="font-size: 0.92rem;">Sign in with administrator credentials.</p>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="admin-email">Admin Email</label>
        <input type="email" id="admin-email" class="form-input" placeholder="admin@gmail.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="admin-password">Password</label>
        <input type="password" id="admin-password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" id="admin-submit-btn" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem; margin-top: 10px;">
        Enter Admin Dashboard
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center;">
      <a href="/" class="text-secondary" style="font-size: 0.88rem;">← Return to Main Platform</a>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('logout')) {
        Auth.clearSession();
        if (window.Toast) {
          Toast.success('Admin logged out successfully.');
        }
      } else if (Auth.isAuthenticated() && Auth.isAdmin()) {
        window.location.href = '/admin/dashboard.html';
        return;
      }

      const form = document.getElementById('admin-login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-password').value;
        const btn = document.getElementById('admin-submit-btn');

        btn.disabled = true;
        btn.textContent = 'Verifying...';

        try {
          const res = await Auth.login(email, password);
          if (res.data?.user?.role !== 'ADMIN') {
            Auth.clearSession();
            throw new Error('Access denied. Administrator privileges required.');
          }
          Toast.success('Admin authorization granted.');
          setTimeout(() => {
            window.location.href = '/admin/dashboard.html';
          }, 500);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Enter Admin Dashboard';
          Toast.error(err.message || 'Login failed.');
        }
      });
    });
  </script>
</body>
</html>
